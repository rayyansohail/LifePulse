<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>LifePulse - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-block bg-rose-600 text-white p-3 rounded-2xl shadow-lg shadow-rose-900/50 mb-2">
                <i class="fa-solid fa-user-shield text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider">REGISTRATION</h1>
            <p class="text-xs text-slate-400">Join LifePulse Emergency Grid</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-xs font-bold bg-rose-500/20 border border-rose-500/40 text-rose-300 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
            </div>
            <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
            </div>
            <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
            </div>
            <div>
                <label class="block text-xs font-mono uppercase text-slate-400 mb-1">Role</label>
                <select name="role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500">
                    <option value="Medical Officer">Medical Officer</option>
                    <option value="Emergency Dispatcher">Emergency Dispatcher</option>
                    <option value="System Administrator">System Administrator</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-rose-900/50 transition-all cursor-pointer">
                Create Account & Save to PostgreSQL
            </button>
        </form>

        <p class="text-center text-xs text-slate-400">
            Already have an account? <a href="/login" class="text-rose-500 font-bold hover:underline">Log in</a>
        </p>
    </div>
</body>
</html>
